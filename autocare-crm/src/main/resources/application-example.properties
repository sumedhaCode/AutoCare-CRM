spring.application.name=autocare-crm

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/autocare_db}
spring.data.mongodb.auto-index-creation=true

jwt.secret=${JWT_SECRET:change-this-to-a-long-secret}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=4000
spring.mail.properties.mail.smtp.timeout=4000
spring.mail.properties.mail.smtp.writetimeout=4000
spring.mail.default-encoding=UTF-8

server.port=8080
